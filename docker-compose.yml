# One-command local setup: database + API + website.
#
#   docker compose up --build
#
# Then open http://localhost:5173 and sign in with  ekta / admin123
# (Admin button, top right). Data and uploads persist in Docker volumes.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: portfolio
      MYSQL_DATABASE: portfolio_platform
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pportfolio"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://db:3306/portfolio_platform?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: portfolio
      UPLOAD_DIR: /data/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Optional: set these to store uploads in Cloudinary instead of the local volume.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_ORIGIN: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads:
