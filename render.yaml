# Render Blueprint — deploys the Spring Boot API as a free Docker web service.
# Render dashboard → New → Blueprint → pick this repo. You'll be prompted for
# every value marked `sync: false` (they are secrets and never stored in git).
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # MySQL connection, e.g. from Aiven (free tier):
      # jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Signs login tokens. Render generates a long random value for you.
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary (free) — used for profile photo, resume, thumbnails, certificates.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Your frontend URL(s), comma-separated. Wildcards allowed for preview deploys:
      # https://your-site.vercel.app,https://*.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Admin login, created on the first start against an empty database.
      - key: ADMIN_USERNAME
        value: ekta
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
