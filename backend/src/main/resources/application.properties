# ==================================================
# Portfolio Platform Configuration
# ==================================================

spring.application.name=portfolio-platform

# ==================================================
# Server Configuration
# ==================================================

server.port=${PORT:8080}

# ==================================================
# Active Profile
# ==================================================
# Defaults to "local" for running on your own computer. An optional,
# gitignored application-local.properties next to this file can override
# anything (e.g. your MySQL password). Production sets SPRING_PROFILES_ACTIVE=prod
# and supplies the env vars below.

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==================================================
# MySQL Database Configuration
# ==================================================

# createDatabaseIfNotExist: the database is created automatically on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_platform?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# Hibernate / JPA Configuration
# ==================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

######################################################
# JWT Configuration
######################################################

jwt.secret=${JWT_SECRET:local-dev-secret-key-do-not-use-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

#########################################
# File Upload Configuration (Cloudinary)
#########################################

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optional. When these are empty, uploads are saved to UPLOAD_DIR on the server
# and served at /uploads/** (fine locally; use Cloudinary in production because
# free hosts wipe the disk on every deploy).
app.storage.local-dir=${UPLOAD_DIR:uploads}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

#########################################
# CORS Configuration
#########################################

# Comma-separated. Wildcard patterns are allowed, e.g.
# https://my-portfolio.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

#########################################
# Admin account (created on first start)
#########################################

app.admin.username=${ADMIN_USERNAME:ekta}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

#########################################
# Hosting / health checks
#########################################

# Respect X-Forwarded-* headers from the hosting platform's proxy (HTTPS URLs).
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Keep the connection pool small for free-tier databases.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
